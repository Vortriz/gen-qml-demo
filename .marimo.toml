[snippets]
custom_paths = []
include_default_snippets = true

[completion]
activate_on_typing = true
copilot = true
signature_hint_on_typing = false

[keymap]
preset = "default"

[keymap.overrides]

[diagnostics]
sql_linter = true

[experimental]
external_agents = true

[formatting]
line_length = 79

[server]
browser = "default"
follow_symlink = false

[save]
format_on_save = true
autosave_delay = 1000
autosave = "after_delay"

[runtime]
watcher_on_save = "lazy"
default_csv_encoding = "utf-8"
show_tracebacks = false
std_stream_max_bytes = 1000000
auto_instantiate = false
auto_reload = "off"
output_max_bytes = 8000000
default_sql_output = "auto"
on_cell_change = "autorun"
reactive_tests = true

[ai.models]
displayed_models = []
custom_models = []

[ai.custom_providers]

[package_management]
manager = "uv"

[display]
default_width = "medium"
default_table_max_columns = 50
code_editor_font_size = 16
dataframes = "rich"
default_table_page_size = 10
cell_output = "below"
theme = "light"
reference_highlighting = true

[language_servers.pylsp]
enable_pyflakes = false
enable_mypy = true
enable_flake8 = false
enable_ruff = true
enabled = true
enable_pydocstyle = false
enable_pylint = false

[mcp]
presets = []

[mcp.mcpServers]
