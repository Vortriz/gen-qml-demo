[server]
browser = "default"
follow_symlink = false

[package_management]
manager = "uv"

[ai.custom_providers]

[ai.models]
displayed_models = []
custom_models = []

[mcp]
presets = []

[mcp.mcpServers]

[language_servers.pylsp]
enable_pyflakes = false
enable_ruff = true
enable_mypy = true
enabled = true
enable_pydocstyle = false
enable_pylint = false
enable_flake8 = false

[display]
default_width = "medium"
dataframes = "rich"
default_table_page_size = 10
cell_output = "below"
default_table_max_columns = 50
code_editor_font_size = 16
theme = "light"
reference_highlighting = true

[keymap]
preset = "default"

[keymap.overrides]

[runtime]
default_csv_encoding = "utf-8"
reactive_tests = true
std_stream_max_bytes = 1000000
auto_instantiate = false
default_sql_output = "auto"
output_max_bytes = 8000000
show_tracebacks = false
auto_reload = "off"
on_cell_change = "autorun"
watcher_on_save = "lazy"

[experimental]
external_agents = true

[snippets]
custom_paths = []
include_default_snippets = true

[completion]
copilot = true
activate_on_typing = true
signature_hint_on_typing = false

[formatting]
line_length = 79

[diagnostics]
sql_linter = true

[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true
