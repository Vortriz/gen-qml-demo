[project]
name = "molab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.23.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pot[backend-torch]>=0.9.6.post1",
    "python-lsp-server>=1.14.0",
    "qutip>=5.2.3",
    "scipy>=1.17.1",
    "tensorcircuit-ng>=1.6.0",
    "torch>=2.11.0",
    "websockets>=16.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
